name: ai-ops-platform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ai-ops-platform-ledger-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    labels:
      com.ai-ops.storage-policy: "32GB maximum host budget"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_NAME: ${APP_NAME:?Set APP_NAME in .env}
      ENVIRONMENT: ${ENVIRONMENT:?Set ENVIRONMENT in .env}
      AUTH_PROVIDER: ${AUTH_PROVIDER:?Set AUTH_PROVIDER in .env}
      ALLOW_DEVELOPMENT_IDENTITY: ${ALLOW_DEVELOPMENT_IDENTITY:?Set ALLOW_DEVELOPMENT_IDENTITY in .env}
      SESSION_TTL_MINUTES: ${SESSION_TTL_MINUTES:?Set SESSION_TTL_MINUTES in .env}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set ALLOWED_ORIGINS in .env}
      REQUIRED_CERTIFICATE_HOLDER: ${REQUIRED_CERTIFICATE_HOLDER:?Set REQUIRED_CERTIFICATE_HOLDER in .env}
      MINIMUM_GL_OCCURRENCE_LIMIT: ${MINIMUM_GL_OCCURRENCE_LIMIT:?Set MINIMUM_GL_OCCURRENCE_LIMIT in .env}
      RULES_VERSION: ${RULES_VERSION:?Set RULES_VERSION in .env}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:?Set MAX_UPLOAD_BYTES in .env}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 30

  runtime-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_NAME: ${APP_NAME:?Set APP_NAME in .env}
      ENVIRONMENT: ${ENVIRONMENT:?Set ENVIRONMENT in .env}
      AUTH_PROVIDER: ${AUTH_PROVIDER:?Set AUTH_PROVIDER in .env}
      ALLOW_DEVELOPMENT_IDENTITY: ${ALLOW_DEVELOPMENT_IDENTITY:?Set ALLOW_DEVELOPMENT_IDENTITY in .env}
      SESSION_TTL_MINUTES: ${SESSION_TTL_MINUTES:?Set SESSION_TTL_MINUTES in .env}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set ALLOWED_ORIGINS in .env}
      REQUIRED_CERTIFICATE_HOLDER: ${REQUIRED_CERTIFICATE_HOLDER:?Set REQUIRED_CERTIFICATE_HOLDER in .env}
      MINIMUM_GL_OCCURRENCE_LIMIT: ${MINIMUM_GL_OCCURRENCE_LIMIT:?Set MINIMUM_GL_OCCURRENCE_LIMIT in .env}
      RULES_VERSION: ${RULES_VERSION:?Set RULES_VERSION in .env}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:?Set MAX_UPLOAD_BYTES in .env}
      RUNTIME_WORKER_ID: ${RUNTIME_WORKER_ID:-compose-runtime-worker}
    command: ["python", "-m", "app.worker"]
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_AUTH_MODE: ${NEXT_PUBLIC_AUTH_MODE:?Set NEXT_PUBLIC_AUTH_MODE in .env}
        NEXT_PUBLIC_ALLOW_DEVELOPMENT_AUTH: ${NEXT_PUBLIC_ALLOW_DEVELOPMENT_AUTH:?Set NEXT_PUBLIC_ALLOW_DEVELOPMENT_AUTH in .env}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      NEXT_PUBLIC_AUTH_MODE: ${NEXT_PUBLIC_AUTH_MODE:?Set NEXT_PUBLIC_AUTH_MODE in .env}
      NEXT_PUBLIC_ALLOW_DEVELOPMENT_AUTH: ${NEXT_PUBLIC_ALLOW_DEVELOPMENT_AUTH:?Set NEXT_PUBLIC_ALLOW_DEVELOPMENT_AUTH in .env}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  ai-ops-platform-ledger-data:
    name: ai-ops-platform-ledger-data
