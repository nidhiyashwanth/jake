name: AI Operations CI

on:
  push:
    branches: [main, "feat/**", "codex/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ai-ops-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python, frontend, harness, and security checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-test.lock

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Create quality environment
        shell: bash
        run: cp .env.example .env

      - name: Install locked Python dependencies
        shell: bash
        run: |
          python -m pip install --requirement backend/requirements.lock
          python -m pip install --requirement backend/requirements-test.lock
          python -m pip install --no-deps --editable backend
          python -m pip install "pip-audit==2.9.0"

      - name: Run Python unit tests and compile checks
        working-directory: backend
        shell: bash
        run: |
          python -m pytest -m "not integration" -q
          python -m compileall -q app migrations tests

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Run frontend typecheck, tests, and production build
        working-directory: frontend
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Run golden evaluation contract on workflow/model changes
        working-directory: backend
        run: python -m pytest tests/test_e01_evaluations.py -q

      - name: Run dependency security audits
        shell: bash
        run: |
          mkdir -p artifacts
          pip-audit --requirement backend/requirements.lock --format json --output artifacts/pip-audit.json --progress-spinner off
          npm --prefix frontend audit --omit=dev --audit-level=high

      - name: Run harness and package static gates
        shell: pwsh
        run: |
          Copy-Item -LiteralPath .env.example -Destination .env -Force
          ./scripts/verify-harness.ps1 -Area All
          ./scripts/verify-fresh-session.ps1
          ./scripts/check-secrets.ps1
          ./scripts/verify-workflows.ps1 -StaticOnly
          ./scripts/verify-runtime.ps1 -StaticOnly
          ./scripts/verify-connectors.ps1 -StaticOnly
          ./scripts/verify-compliance.ps1 -StaticOnly
          ./scripts/verify-confidence.ps1 -StaticOnly
          ./scripts/verify-evaluations.ps1 -StaticOnly
          ./scripts/verify-inspector.ps1 -StaticOnly
          ./scripts/verify-value-ledger.ps1 -StaticOnly
          ./scripts/verify-governance.ps1 -StaticOnly
          ./scripts/verify-migrations.ps1 -StaticOnly
          ./scripts/generate-sbom.ps1 -Image unused -StaticOnly
          ./scripts/verify-x01.ps1 -StaticOnly
          ./scripts/verify-launch.ps1 -StaticOnly

  integration:
    name: Ephemeral PostgreSQL, migrations, staging smoke, and image reports
    runs-on: ubuntu-latest
    needs: quality
    env:
      CI_PROJECT: ai-ops-platform-ci
      CI_ENV_FILE: .env.ci
      CI_DATABASE_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked Python test dependencies
        shell: bash
        run: |
          python -m pip install --requirement backend/requirements.lock
          python -m pip install --requirement backend/requirements-test.lock
          python -m pip install --no-deps --editable backend

      - name: Install Chromium for browser smoke
        shell: bash
        run: python -m playwright install --with-deps chromium

      - name: Create ephemeral CI environment
        shell: pwsh
        run: |
          @"
          APP_NAME=AI Operations CI
          ENVIRONMENT=development
          AUTH_PROVIDER=development
          ALLOW_DEVELOPMENT_IDENTITY=true
          SESSION_TTL_MINUTES=480
          POSTGRES_USER=ci_owner
          POSTGRES_PASSWORD=$env:CI_DATABASE_PASSWORD
          POSTGRES_APP_USER=ci_app_user
          POSTGRES_APP_PASSWORD=${env:CI_DATABASE_PASSWORD}-app
          POSTGRES_DB=ci_db
          POSTGRES_PORT=15432
          POSTGRES_VOLUME_NAME=ai-ops-platform-ci-data
          BACKEND_PORT=18000
          FRONTEND_PORT=13000
          ALLOWED_ORIGINS=http://localhost:13000
          REQUIRED_CERTIFICATE_HOLDER=Northwind Construction LLC
          MINIMUM_GL_OCCURRENCE_LIMIT=2000000
          RULES_VERSION=rules.v1
          MAX_UPLOAD_BYTES=10485760
          DATABASE_ADMIN_URL=postgresql+psycopg://ci_owner:${env:CI_DATABASE_PASSWORD}@localhost:15432/ci_db
          VAULT_KEK_BASE64=
          VAULT_KEY_VERSION=ci-kms-v1
          CONNECTOR_EGRESS_ALLOWLIST=localhost,sandbox.local,mcp.local,rest.local
          VALUE_INFRA_COST_PER_RUN_USD=0
          NEXT_PUBLIC_API_BASE_URL=http://localhost:18000
          NEXT_PUBLIC_AUTH_MODE=development
          NEXT_PUBLIC_ALLOW_DEVELOPMENT_AUTH=true
          "@ | Set-Content -LiteralPath $env:CI_ENV_FILE -Encoding utf8

      - name: Build images from the exact Dockerfiles
        shell: bash
        run: |
          docker build --tag ai-ops-ci-backend:${GITHUB_SHA} ./backend
          docker build --tag ai-ops-ci-frontend:${GITHUB_SHA} --build-arg NEXT_PUBLIC_API_BASE_URL=http://localhost:18000 --build-arg NEXT_PUBLIC_AUTH_MODE=development --build-arg NEXT_PUBLIC_ALLOW_DEVELOPMENT_AUTH=true ./frontend

      - name: Start ephemeral Compose services
        shell: bash
        run: |
          docker compose --project-name "$CI_PROJECT" --env-file "$CI_ENV_FILE" --file docker-compose.yml up -d --build
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:18000/api/health > /dev/null && curl --fail --silent http://localhost:13000 > /dev/null; then exit 0; fi
            sleep 2
          done
          docker compose --project-name "$CI_PROJECT" --env-file "$CI_ENV_FILE" --file docker-compose.yml ps
          exit 1

      - name: Verify migration head and run PostgreSQL integration suite
        working-directory: backend
        shell: bash
        run: |
          docker compose --project-name "$CI_PROJECT" --env-file "../$CI_ENV_FILE" --file ../docker-compose.yml exec -T backend alembic current
          DATABASE_ADMIN_URL="postgresql+psycopg://ci_owner:${CI_DATABASE_PASSWORD}@localhost:15432/ci_db" DATABASE_URL="postgresql+psycopg://ci_app_user:${CI_DATABASE_PASSWORD}-app@localhost:15432/ci_db" python -m pytest -m integration -q

      - name: Run staging-sandbox and recovery evidence
        shell: pwsh
        run: |
          Copy-Item -LiteralPath $env:CI_ENV_FILE -Destination .env -Force
          ./scripts/verify-x01.ps1 -SkipImageScan

      - name: Run release-candidate acceptance and role tour
        shell: pwsh
        run: ./scripts/verify-launch.ps1

      - name: Prepare image evidence directory
        shell: bash
        run: mkdir -p artifacts

      - name: Generate backend SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ai-ops-ci-backend:${{ github.sha }}
          artifact-name: backend.sbom.spdx.json
          output-file: artifacts/backend.sbom.spdx.json

      - name: Scan backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ai-ops-ci-backend:${{ github.sha }}
          format: sarif
          output: artifacts/backend.trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          limit-severities-for-sarif: true
          exit-code: "1"

      - name: Generate frontend SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ai-ops-ci-frontend:${{ github.sha }}
          artifact-name: frontend.sbom.spdx.json
          output-file: artifacts/frontend.sbom.spdx.json

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ai-ops-ci-frontend:${{ github.sha }}
          format: sarif
          output: artifacts/frontend.trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          limit-severities-for-sarif: true
          exit-code: "1"

      - name: Upload SBOM, audit, and recovery evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-ops-ci-evidence-${{ github.sha }}
          path: |
            artifacts/
            .env.ci
          if-no-files-found: ignore

      - name: Stop only the ephemeral Compose project
        if: always()
        shell: bash
        run: docker compose --project-name "$CI_PROJECT" --env-file "$CI_ENV_FILE" --file docker-compose.yml down --volumes --remove-orphans
